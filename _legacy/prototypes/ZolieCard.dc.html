<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;height:100%;background:#fff;border:1px solid #EAE4D8;border-radius:3px;overflow:hidden;position:relative;transition:box-shadow .3s ease,transform .3s ease,border-color .3s ease" style-hover="box-shadow:0 22px 44px -26px rgba(72,26,110,.4);transform:translateY(-4px);border-color:#DED3BE">
  <div style="position:absolute;top:10px;left:10px;z-index:2;display:flex;flex-direction:column;gap:5px;align-items:flex-start">
    <sc-if value="{{ p.temDesconto }}" hint-placeholder-val="{{ true }}">
      <span style="background:#D4AF37;color:#2E2A24;font:500 10px/1 'Jost',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;border-radius:2px">{{ p.descTxt }}</span>
    </sc-if>
    <sc-if value="{{ p.lancamento }}">
      <span style="background:#fff;color:#7E6210;border:1px solid #DED3BE;font:500 10px/1 'Jost',sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:6px 8px;border-radius:2px">Lançamento</span>
    </sc-if>
  </div>

  <button type="button" onClick="{{ p.onWish }}" aria-label="Adicionar aos favoritos" style="position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border:none;border-radius:50%;background:rgba(255,255,255,.92);cursor:pointer;display:grid;place-items:center;font-size:16px;line-height:1;color:#8A6B12;transition:background .2s ease" style-hover="background:#F5EFDF">
    <sc-if value="{{ p.wished }}" hint-placeholder-val="{{ false }}"><span>♥</span></sc-if>
    <sc-if value="{{ p.notWished }}" hint-placeholder-val="{{ true }}"><span style="color:#8F857C">♡</span></sc-if>
  </button>

  <div onClick="{{ p.onOpen }}" role="button" tabIndex="0" style="cursor:pointer;aspect-ratio:1/1;background:repeating-linear-gradient(135deg,#F7F4EC 0 7px,#EFE9DC 7px 14px);display:grid;place-items:center;padding:12px">
    <span style="font:400 9px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#8F857C;text-align:center">foto do produto<br />{{ p.slug }}</span>
  </div>

  <div style="display:flex;flex-direction:column;gap:5px;padding:13px 13px 15px;flex:1">
    <span style="font:400 9px/1 'Jost',sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#8F857C">{{ p.materialLabel }}</span>
    <a onClick="{{ p.onOpen }}" role="button" tabIndex="0" style="cursor:pointer;font:400 14px/1.3 'Cormorant Garamond',Georgia,serif;color:#2E2A24;text-decoration:none;text-wrap:pretty;min-height:36px" style-hover="color:#8A6B12">{{ p.nome }}</a>
    <div style="display:flex;align-items:center;gap:5px">
      <span style="font-size:11px;color:#8A6B12;letter-spacing:.05em">{{ p.estrelas }}</span>
      <span style="font:300 10px/1 'Jost',sans-serif;color:#8F857C">({{ p.avaliacoes }})</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:1px;margin-top:1px">
      <sc-if value="{{ p.temDesconto }}" hint-placeholder-val="{{ true }}">
        <span style="font:300 11px/1 'Jost',sans-serif;color:#8F857C;text-decoration:line-through">{{ p.precoDeFmt }}</span>
      </sc-if>
      <span style="font:500 18px/1.1 'Jost',sans-serif;color:#2E2A24">{{ p.precoFmt }}</span>
      <span style="font:400 10px/1.4 'Jost',sans-serif;color:#8A6B12">{{ p.pixFmt }} no Pix</span>
      <span style="font:300 10px/1.4 'Jost',sans-serif;color:#8F857C">ou {{ p.parcelaFmt }}</span>
    </div>
    <sc-if value="{{ p.estoqueBaixo }}" hint-placeholder-val="{{ false }}">
      <span style="font:400 9px/1.4 'Jost',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:#A6533B">Últimas {{ p.estoque }} peças</span>
    </sc-if>
    <button type="button" onClick="{{ p.onAdd }}" style="margin-top:auto;border:1px solid #B8942A;background:#fff;color:#8A6B12;font:500 10px/1.2 'Jost',sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:11px 8px;border-radius:2px;cursor:pointer;white-space:nowrap;transition:background .2s ease,color .2s ease" style-hover="background:#D4AF37;color:#2E2A24">Comprar</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:190,&quot;height&quot;:340},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Product&quot;}}"></script>
</body>
</html>
